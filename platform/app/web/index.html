<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="IsangoTech Business: your WhatsApp Assistant dashboard">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="IsangoTech">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <meta name="theme-color" content="#1B2A4A">
  <meta name="robots" content="noindex">

  <title>IsangoTech Business</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Shown the moment the page opens, while the app starts (a few seconds on
       a phone); removed when the app draws its first frame. */
    html, body { margin: 0; background: #1B2A4A; }
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: #1B2A4A; color: #F5EBDD;
      font: 600 20px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.35s ease;
    }
    #splash svg { width: 56px; height: 90px; animation: pulse 1.6s ease-in-out infinite; }
    #splash.done { opacity: 0; pointer-events: none; }
    @keyframes pulse { 50% { opacity: 0.55; transform: scale(0.96); } }
    @media (prefers-reduced-motion: reduce) {
      #splash svg { animation: none; }
      #splash { transition: none; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="Loading IsangoTech Business">
    <svg viewBox="0 -816 560 900" aria-hidden="true">
      <rect x="0" y="-816" width="560" height="900" rx="56" fill="#2BA8A0"/>
      <path d="M84 -732H476V0H304V-580Z" fill="#E07A1F"/>
    </svg>
    <span>IsangoTech</span>
  </div>
  <script>
    window.addEventListener("flutter-first-frame", function () {
      var splash = document.getElementById("splash");
      if (!splash) return;
      splash.classList.add("done");
      setTimeout(function () { splash.remove(); }, 400);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
