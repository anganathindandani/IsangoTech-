name: Deploy business app

# Builds the client businesses' Flutter app and publishes it to Cloudflare
# Workers whenever main changes. Does nothing until these are set in the
# GitHub repository (Settings → Secrets and variables → Actions):
#   secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   variables: PLATFORM_SUPABASE_URL, PLATFORM_SUPABASE_PUBLISHABLE_KEY

on:
  push:
    branches: [main]
    paths: ["platform/app/**", ".github/workflows/deploy-app.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-app
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/app
    steps:
      - name: Check deployment settings
        id: ready
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          URL: ${{ vars.PLATFORM_SUPABASE_URL }}
          KEY: ${{ vars.PLATFORM_SUPABASE_PUBLISHABLE_KEY }}
        working-directory: .
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ] && [ -n "$URL" ] && [ -n "$KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::App deploy skipped: add the Cloudflare secrets and platform Supabase variables to enable it."
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.ready == 'true'
      - uses: subosito/flutter-action@v2
        if: steps.ready.outputs.ready == 'true'
        with:
          channel: stable
          cache: true
      - name: Build
        if: steps.ready.outputs.ready == 'true'
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn \
            --dart-define=SUPABASE_URL=${{ vars.PLATFORM_SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.PLATFORM_SUPABASE_PUBLISHABLE_KEY }}
      - name: Deploy to Cloudflare
        if: steps.ready.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: platform/app
